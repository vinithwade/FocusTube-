<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>FocusTube — Watch</title>
  <link rel="stylesheet" href="styles/goal.css" />
</head>
<body class="watch-page">
  <div id="top-bar" class="watch-bar">
    <div class="watch-goal">
      <span class="goal-label">Learning:</span>
      <span id="goal-text"></span>
    </div>
    <button id="end-session" class="danger-btn">End session</button>
  </div>

  <div class="player-wrap">
    <iframe
      id="player"
      allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
      allowfullscreen
      referrerpolicy="strict-origin-when-cross-origin"
    ></iframe>
  </div>

  <div class="watch-meta">
    <h1 id="video-title"></h1>
  </div>

  <script src="config.js"></script>
  <script src="watch.js"></script>
</body>
</html>
