services:
  - type: web
    name: focustube-api
    runtime: node
    plan: free
    buildCommand: cd api && npm install && npm run build
    startCommand: cd api && npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: EMBEDDING_MODEL
        value: Xenova/bge-small-en-v1.5
      - key: NODE_OPTIONS
        value: --max-old-space-size=460
